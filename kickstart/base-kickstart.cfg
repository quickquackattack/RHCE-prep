# Rocky Linux 9 Kickstart Template for Ansible Lab
# This file is used as a template - actual files are generated with VM-specific settings

# Use text install (no GUI)
text

# Don't run Setup Agent on first boot
firstboot --disable

# Keyboard and language
keyboard us
lang en_US.UTF-8

# Network (will be customized per VM)
# network --bootproto=static --ip=192.168.100.X --netmask=255.255.255.0 --gateway=192.168.100.1 --nameserver=8.8.8.8 --hostname=vmname.ansible.lab --device=eth0 --onboot=yes

# Root password locked (using ansible user instead)
rootpw --lock

# System timezone
timezone America/New_York --utc

# Bootloader
bootloader --location=mbr --boot-drive=vda

# Partition clearing
clearpart --all --initlabel --drives=vda

# Disk partitioning (simple layout)
part /boot --fstype=xfs --size=1024 --ondisk=vda
part pv.01 --size=1 --grow --ondisk=vda
volgroup vg_main pv.01
logvol / --fstype=xfs --name=lv_root --vgname=vg_main --size=8192 --grow
logvol swap --fstype=swap --name=lv_swap --vgname=vg_main --size=1024

# Reboot after installation
reboot

# Package selection (minimal + essentials)
%packages
@core
@base
vim
wget
curl
git
openssh-server
python3
python3-pip
net-tools
bind-utils
%end

# Post-installation script
%post --log=/root/ks-post.log

echo "Starting post-installation configuration..."

# Create ansible user
useradd -m -s /bin/bash ansible
echo "Created ansible user"

# Set up passwordless sudo
echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible
chmod 0440 /etc/sudoers.d/ansible
echo "Configured sudo for ansible user"

# Create SSH directory
mkdir -p /home/ansible/.ssh
chmod 700 /home/ansible/.ssh

# SSH public key will be injected here by the setup script
# cat > /home/ansible/.ssh/authorized_keys << 'SSHKEY'
# ssh-rsa AAAA... your-key-here
# SSHKEY

chmod 600 /home/ansible/.ssh/authorized_keys
chown -R ansible:ansible /home/ansible/.ssh
echo "SSH keys configured"

# Enable SSH service
systemctl enable sshd
systemctl start sshd
echo "SSH service enabled"

# Configure firewall for SSH
firewall-cmd --permanent --add-service=ssh
firewall-cmd --reload
echo "Firewall configured"

# Set SELinux to permissive for lab environment
sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config
setenforce 0 || true
echo "SELinux set to permissive"

# Update system
dnf update -y
echo "System updated"

echo "Post-installation configuration complete!"

%end
