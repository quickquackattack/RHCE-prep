# Rocky Linux 9 Kickstart Configuration
# Ansible Lab - Node 1

#version=RHEL9

# Use text mode install
text

# Don't run the Setup Agent on first boot
firstboot --disable

# Keyboard layouts
keyboard --xlayouts='us'

# System language
lang en_US.UTF-8

# Network information
network --bootproto=static --device=eth0 --ip=192.168.100.11 --netmask=255.255.255.0 --gateway=192.168.100.1 --nameserver=8.8.8.8,8.8.4.4 --hostname=node1.ansible.lab --activate --onboot=yes

# Root password (locked - use ansible user)
rootpw --lock

# System timezone
timezone America/New_York --utc

# System bootloader configuration
bootloader --location=mbr --boot-drive=vda --append="console=ttyS0,115200n8"

# Partition clearing information
clearpart --all --initlabel --drives=vda
zerombr

# Disk partitioning information
part /boot --fstype="xfs" --ondisk=vda --size=1024
part pv.01 --fstype="lvmpv" --ondisk=vda --size=1 --grow

volgroup vg_main --pesize=4096 pv.01
logvol / --fstype="xfs" --size=8192 --grow --name=lv_root --vgname=vg_main
logvol swap --fstype="swap" --size=1024 --name=lv_swap --vgname=vg_main

# System authorization information
authselect select minimal

# SELinux configuration
selinux --permissive

# Firewall configuration
firewall --enabled --service=ssh

# Do not configure the X Window System
skipx

# System services
services --enabled="chronyd,sshd"

# Shutdown after installation
poweroff

# Package selection
%packages
@^minimal-environment
@standard
vim-enhanced
wget
curl
net-tools
openssh-server
python3
bash-completion
%end

# Post-installation script
%post --log=/root/ks-post.log

# Create ansible user
/usr/sbin/useradd -m -s /bin/bash -c "Ansible User" ansible

# Set up passwordless sudo
echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible
chmod 0440 /etc/sudoers.d/ansible

# Create .ssh directory
mkdir -p /home/ansible/.ssh
chmod 700 /home/ansible/.ssh

# Add SSH public key - REPLACE WITH YOUR KEY!
cat > /home/ansible/.ssh/authorized_keys << 'EOF_SSHKEY'
ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC... your-ssh-public-key-here ansible-lab-key
EOF_SSHKEY

chmod 600 /home/ansible/.ssh/authorized_keys
chown -R ansible:ansible /home/ansible/.ssh

# Disable password authentication
sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/g' /etc/ssh/sshd_config
sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/g' /etc/ssh/sshd_config

systemctl enable sshd

# Update system
dnf update -y

# Set hostname
hostnamectl set-hostname node1.ansible.lab

# Configure /etc/hosts
cat >> /etc/hosts << 'EOF_HOSTS'
192.168.100.10  control.ansible.lab control
192.168.100.11  node1.ansible.lab node1
192.168.100.12  node2.ansible.lab node2
192.168.100.13  node3.ansible.lab node3
192.168.100.14  node4.ansible.lab node4
EOF_HOSTS

# Set up motd
cat > /etc/motd << 'EOF_MOTD'
╔══════════════════════════════════════════════════════╗
║        Ansible Lab - Node 1                          ║
║        Rocky Linux 9 - Managed by Kickstart          ║
╚══════════════════════════════════════════════════════╝

Hostname: node1.ansible.lab
IP: 192.168.100.11

Login as: ansible

EOF_MOTD

echo "Post-installation completed on $(date)" >> /root/ks-post.log

%end
